<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MXS4ZNM27S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-MXS4ZNM27S');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIME CAPSULE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="tooltip" class="tooltip"></div>

<!-- MODALE ACQUISTO / CONFIGURAZIONE PIXEL -->
<div id="modal-acquisto" class="modal-hidden">
    <div class="modal-content">
        <h3>CLAIM YOUR PIXEL</h3>
        <p id="data-scelta" style="font-weight: bold; margin-bottom: 15px;"></p>
        
        <div class="input-group">
            <label>Your Message (max 150 chars):</label>
            <textarea id="input-messaggio" placeholder="Write your message, joke or secret..." maxlength="150" rows="3"></textarea>
        </div>

        <div class="input-group">
            <label>Choose your Pixel Color:</label>
            <div class="color-picker-container">
                <input type="color" id="input-colore" value="#3b82f6">
                <span id="colore-hex">#3b82f6</span>
            </div>
        </div>

        <div class="input-group">
            <label>Account Access (to edit later):</label>
            <input type="email" id="input-email" placeholder="Your email">
            <input type="password" id="input-password" placeholder="Create a password">
        </div>

        <div class="modal-btns">
            <button id="btn-conferma">PAY NOW (1€)</button>
            <button id="btn-chiudi">CANCEL</button>
        </div>
    </div>
</div>

<div class="container">
    <h1>TIME CAPSULE</h1>
    
    <div class="nav-controls">
        <button onclick="cambiaData(-400)">← PREV</button>
        <button onclick="cambiaData(400)">NEXT →</button>
    </div>

    <div id="counter">
        Pixels claimed: <span id="pixel-count">0</span>/400
    </div>

    <div class="scroller-container">
        <div id="tabellone" class="griglia"></div>
    </div>
    
    <div class="footer-note">
        <p>Each pixel represents one day. Claim your moment in history.</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
