<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Machine Grid</title>
    <!-- Evita l'errore 404 della favicon -->
    <link rel="icon" href="data:,">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }
        input, button {
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
        }
        input {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
        }
        button {
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #45a049;
        }
        #status {
            margin-top: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Time Machine Grid</h2>
        <p>Invia i tuoi dati a Google Apps Script</p>
        
        <input type="text" id="dataInput" placeholder="Inserisci un valore...">
        <button id="sendBtn" onclick="sendData()">Invia Dati</button>
        
        <div id="status"></div>
    </div>

    <script>
        // Sostituisci con il tuo URL Apps Script che termina con /exec
        const APPS_SCRIPT_URL = 'INSERISCI_QUI_IL_TUO_URL_DI_APPS_SCRIPT';

        async function sendData() {
            const inputVal = document.getElementById('dataInput').value;
            const statusDiv = document.getElementById('status');

            if (!inputVal.trim()) {
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = 'Inserisci prima un valore valido.';
                return;
            }

            statusDiv.style.color = '#f39c12';
            statusDiv.innerText = 'Invio in corso...';

            try {
                // Esempio di richiesta POST (se il tuo script gestisce doPost)
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Spesso necessario con Apps Script per evitare blocchi CORS iniziali
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ value: inputVal })
                });

                statusDiv.style.color = '#2ecc71';
                statusDiv.innerText = 'Richiesta inviata con successo!';
                document.getElementById('dataInput').value = '';

            } catch (error) {
                console.error('Errore di connessione:', error);
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = 'Errore durante la comunicazione con il server.';
            }
        }
    </script>

</body>
</html>
