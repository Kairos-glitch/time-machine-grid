<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Capsule</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Pulsante Account in alto a destra -->
    <div class="user-account-bar">
        <button id="btn-apri-account" class="account-icon-btn" title="Account">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </button>
    </div>

    <h1>TIME CAPSULE</h1>
    <div id="counter">Total Claimed Pixels: <span id="pixel-count">0</span> / 400</div>

    <!-- Controlli di navigazione date -->
    <div class="nav-controls">
        <button class="nav-btn" onclick="cambiaData(-20)">Prev</button>
        <button class="nav-btn" onclick="cambiaData(20)">Next</button>
    </div>

    <!-- Griglia dei Pixel -->
    <div class="scroller-container">
        <div id="tabellone" class="griglia"></div>
    </div>

    <!-- Tooltip per l'anteprima -->
    <div id="tooltip" class="tooltip"></div>

    <!-- Modale Acquisto / Modifica Pixel -->
    <div id="modal-acquisto" class="modal-hidden">
        <div class="modal-content">
            <h3 id="modal-main-title">CLAIM YOUR PIXEL</h3>
            <p id="data-scelta" style="font-size: 13px; color: var(--text-muted); margin-top: 0; text-align: center;"></p>
            
            <div class="input-group">
                <label>Message / Dedication</label>
                <textarea id="input-messaggio" rows="3" placeholder="Write something for this day..."></textarea>
            </div>

            <div class="input-group">
                <label>External Link (URL)</label>
                <input type="text" id="input-link" placeholder="https://yourwebsite.com">
            </div>

            <div class="input-group">
                <label>Upload Image</label>
                <input type="file" id="input-file-immagine" accept="image/*" style="font-size: 12px; color: var(--text-muted); padding: 6px 0;">
            </div>

            <div class="input-group" id="color-picker-section">
                <label>Pixel Color</label>
                <div class="color-palette">
                    <div class="color-dot active" data-color="#38bdf8" style="background: #38bdf8;"></div>
                    <div class="color-dot" data-color="#f43f5e" style="background: #f43f5e;"></div>
                    <div class="color-dot" data-color="#10b981" style="background: #10b981;"></div>
                    <div class="color-dot" data-color="#f59e0b" style="background: #f59e0b;"></div>
                    <div class="color-dot" data-color="#8b5cf6" style="background: #8b5cf6;"></div>
                    <div class="color-picker-wrapper" title="Custom color">
                        <input type="color" id="input-colore-custom" value="#38bdf8">
                    </div>
                </div>
            </div>

            <div class="input-group" id="promo-section">
                <label>Promo Code</label>
                <div class="promo-container">
                    <input type="text" id="input-promo" placeholder="Enter code">
                    <button id="btn-applica-promo" type="button">Apply</button>
                </div>
                <small id="promo-feedback"></small>
            </div>

            <div style="margin: 14px 0; font-size: 14px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 10px;">
                <span>Total Price:</span>
                <strong id="prezzo-finale" style="color: var(--accent-color); font-size: 16px;">1.00€</strong>
            </div>

            <div class="modal-btns">
                <button id="btn-chiudi" class="btn-secondary" type="button">Cancel</button>
                <button id="btn-conferma" type="button">PAY 1.00€</button>
            </div>
        </div>
    </div>

    <!-- Modale Account (Login / Registrazione) -->
    <div id="modal-account" class="modal-hidden">
        <div class="modal-content">
            <h3 id="account-title">USER ACCOUNT</h3>
            <p id="account-subtitle" style="font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 0;">Manage your claimed pixels</p>
            
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="acc-email" placeholder="your@email.com">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="acc-password" placeholder="••••••••">
            </div>

            <small id="account-feedback" style="display:block; margin-bottom: 10px; text-align:center;"></small>

            <div class="modal-btns">
                <button id="acc-btn-chiudi" class="btn-secondary" type="button">Cancel</button>
                <button id="acc-btn-azione" type="button">LOG IN</button>
            </div>

            <div style="text-align: center; margin-top: 14px;">
                <a href="#" id="acc-toggle-mode" style="font-size: 12px; color: var(--accent-color); text-decoration: none;">Don't have an account? Sign up</a>
            </div>
        </div>
    </div>

    <div class="footer-note">Preserving memories, one pixel at a time.</div>

    <script src="script.js"></script>
</body>
</html>
