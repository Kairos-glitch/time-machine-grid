<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MXS4ZNM27S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MXS4ZNM27S');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIME CAPSULE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGO IN ALTO A SINISTRA -->
<div class="site-logo">
    <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
</div>

<!-- PULSANTE ACCOUNT CON ICONA OMINO IN ALTO A DESTRA -->
<div class="user-account-bar">
    <button id="btn-apri-account" class="account-icon-btn" title="Account">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
    </button>
</div>

<div id="tooltip" class="tooltip"></div>

<!-- MODALE ACCOUNT (LOGIN / REGISTRAZIONE) -->
<div id="modal-account" class="modal-hidden">
    <div class="modal-content">
        <h3 id="account-title">USER ACCOUNT</h3>
        <p id="account-subtitle" style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px; text-align: center;">Log in to claim and edit your pixels</p>
        
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="acc-email" placeholder="your@email.com">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="acc-password" placeholder="••••••••">
        </div>

        <div id="account-feedback" style="font-size: 11px; margin-bottom: 10px; text-align: center;"></div>

        <div class="modal-btns">
            <button id="acc-btn-azione">LOG IN</button>
            <button id="acc-btn-chiudi" class="btn-secondary">CLOSE</button>
        </div>
        <div style="text-align: center; margin-top: 12px;">
            <a href="#" id="acc-toggle-mode" style="font-size: 11px; color: var(--accent-color); text-decoration: none;">Don't have an account? Sign up</a>
        </div>
    </div>
</div>

<!-- MODALE GESTIONE PIXEL (ACQUISTO O EDIT) -->
<div id="modal-acquisto" class="modal-hidden">
    <div class="modal-content">
        <h3 id="modal-main-title">CLAIM YOUR PIXEL</h3>
        <p id="data-scelta" style="font-weight: 600; margin-bottom: 15px; color: var(--accent-color); text-align: center;"></p>
        
        <div class="input-group">
            <label>Your Message (max 150 chars)</label>
            <textarea id="input-messaggio" placeholder="Write your message, joke or secret..." maxlength="150" rows="3"></textarea>
        </div>

        <div class="input-group">
            <label>Choose Pixel Color</label>
            <div class="color-palette">
                <div class="color-dot active" style="background: #38bdf8;" data-color="#38bdf8"></div>
                <div class="color-dot" style="background: #a855f7;" data-color="#a855f7"></div>
                <div class="color-dot" style="background: #ec4899;" data-color="#ec4899"></div>
                <div class="color-dot" style="background: #22c55e;" data-color="#22c55e"></div>
                <div class="color-dot" style="background: #eab308;" data-color="#eab308"></div>
                <div class="color-dot" style="background: #f97316;" data-color="#f97316"></div>
                <div class="color-picker-wrapper" title="Custom color">
                    <input type="color" id="input-colore-custom" value="#38bdf8">
                </div>
            </div>
        </div>

        <div class="input-group" id="promo-section">
            <label>Promo Code</label>
            <div class="promo-container">
                <input type="text" id="input-promo" placeholder="Enter code">
                <button id="btn-applica-promo" type="button">Apply</button>
            </div>
            <span id="promo-feedback"></span>
        </div>

        <div class="modal-btns">
            <button id="btn-conferma">PAY <span id="prezzo-finale">1€</span></button>
            <button id="btn-chiudi" class="btn-secondary">CANCEL</button>
        </div>
    </div>
</div>

<div class="container">
    <h1>TIME CAPSULE</h1>
    
    <div class="nav-controls">
        <button class="nav-btn" onclick="cambiaData(-400)">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            PREV
        </button>
        <button class="nav-btn" onclick="cambiaData(400)">
            NEXT
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
    </div>

    <div id="counter">
        Pixels claimed: <span id="pixel-count">0</span>/400
    </div>

    <div class="scroller-container">
        <div id="tabellone" class="griglia"></div>
    </div>
    
    <div class="footer-note">
        <p>Each pixel represents one day. Claim your moment in history.</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
